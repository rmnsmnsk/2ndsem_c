name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang-format clang-tidy

    - name: Create dummy compile_commands.json
      run: |
        mkdir -p build
        echo '[]' > build/compile_commands.json

    - name: Configure CMake
      run: cmake -B build

    - name: Build all
      run: cmake --build build

    - name: Run clang-tidy
      run: run-clang-tidy -p build -quiet || true

    - name: Run tests
      run: |
        if cmake --build build --target check_hw_1 2>/dev/null; then
          cmake --build build --target check_hw_1
        elif cmake --build build --target check_hw_2 2>/dev/null; then
          cmake --build build --target check_hw_2
        fi